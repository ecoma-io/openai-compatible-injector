# Runtime configuration for openai-compatible-injector.
# The process polls this file every second and hot-reloads validated changes
# when its content hash changes. Copy it to config.yaml, replace the example
# models, api-key and injection prompts, then start the service. config.yaml
# is intentionally ignored because it carries the client api-key and endpoint
# URLs the operator does not want in the tree.
#
# Bootstrap settings (OAICR_LISTEN, OAICR_CONFIG_FILE,
# OAICR_CONFIG_POLL_INTERVAL, OAICR_SHUTDOWN_GRACE,
# OAICR_AUTH_DATABASE_URL, OAICR_USAGE_DATABASE_URL) come from the
# environment and do NOT belong in this file.
# A runtime file that tries to define them is rejected by strict decoding —
# when a bad reload is writing, the last-known-good config keeps serving;
# when first boot is reading, the process refuses to start.

# Required. The API key clients must present as `Authorization: Bearer <key>`
# on every /v1 request. The client's Authorization header authenticates the
# client TO this proxy and is consumed here — it is never forwarded upstream
# (upstreams are expected to be trusted/internal). Rotating the key is a
# hot-reload: write the new value and clients must switch on their next
# request. The key is an RFC 6750 Bearer token (letters, digits, - . _ ~ + /
# and trailing = padding only). A file without a non-empty valid api-key is
# rejected — a keyless boot refuses to
# start, a keyless reload keeps the last-known-good key serving.
#
# This key is the credential of STATIC mode — the default. When the proxy is
# started with OAICR_AUTH_DATABASE_URL set (partner mode), /v1 requests
# authenticate against hashed per-partner keys managed with
# `openai-compatible-injector keys create|list|revoke` instead, and this
# value is NOT honored on the wire (it stays required here so the file
# schema and a static-mode fallback stay unchanged). See README
# "Partner API keys".
api-key: change-me-client-key

# Optional. Named outbound paths a provider can route through: direct (the
# default — plain egress, ambient HTTP_PROXY/HTTPS_PROXY/NO_PROXY honored),
# exactly ONE configured proxy endpoint, or a POOL of such endpoints with
# per-request scheduling, eligibility gates, bounded egress fallback and
# passive health. Userinfo in a proxy URL (user:pass@) is the proxy's own
# authentication and never appears in logs or error text.
#
# Proxy schemes:
#   http://   HTTP forward proxy (https targets ride CONNECT tunnels)
#   https://  same, TLS-encrypted hop to the proxy
#   socks5:// upstream hostname resolved LOCALLY (the proxy sees only the IP)
#   socks5h:// hostname sent to the proxy — REMOTE DNS, keeps upstream
#             hostnames out of the local resolver
# The proxy URL needs a host, an explicit port, and nothing after the
# authority (no path, query or fragment). For socks5/socks5h, each
# credential field is RFC 1929-limited to 255 decoded bytes — a longer
# value rejects the file.
#
# Pool semantics: each request is scheduled onto ONE member. Members the
# request cannot use are skipped without a dial (streaming gate, body-size
# gate checked BEFORE sending, concurrency cap, health cooldown). A dialed
# member failing before any response is retried on the next eligible member
# up to fallback max-attempts; ANY response — 429 and 5xx included — ends
# the attempt loop (statuses are answers, never fallback triggers). A pool
# member must reference a direct or proxy transport by name; pools never
# nest. An unchanged pool keeps its scheduler position, health state and
# connection pools across reloads; a changed policy starts fresh.
transports:
  direct-egress:
    # direct must not set a proxy URL; a provider without a transport
    # reference gets this implicitly.
    type: direct
  # proxy-egress:
  #   type: proxy
  #   proxy: "socks5h://user:pass@10.0.0.5:1080"
  # pool-egress:
  #   type: pool
  #   members: # ordered; fallback walks the remaining members in this order
  #     # two members must not resolve to the SAME endpoint (checked on the
  #     # resolved endpoint, not the name) — that rejects the whole file
  #     - transport: proxy-egress
  #       max-body-bytes: 4718592 # skip this member for larger bodies — pre-send
  #       max-concurrency: 4 # 0/unset = unlimited; held until the body closes
  #       streaming: true # default true; false = never scheduled streamed requests
  #       weight: 1 # weighted_round_robin share; default 1, at least 1
  #     - transport: direct-egress # bare form: all defaults
  #   strategy: round_robin # round_robin (default) | weighted_round_robin
  #   fallback:
  #     enabled: true # default true; false = exactly one endpoint dialed
  #     max-attempts: 3 # distinct endpoints dialed; default 3, cap 16
  #   health:
  #     enabled: true # default true
  #     failure-threshold: 3 # consecutive transport failures trip the cooldown
  #     cooldown: 30s # default 30s, min 1s; any response resets the count

# Optional. Named upstream bases, so several models can share one endpoint
# and one egress. base-url is validated exactly like a model endpoint;
# transport must name an entry of the transports table above (there is no
# fallback to direct for an unknown name). Entries are validated even when
# no model references them.
providers:
  opencode:
    base-url: https://api.opencode.example/v1
    transport: direct-egress

models:
  # Every public model name a client may request. The request's `model`
  # field is matched against these keys and sent upstream as
  # `upstream-model`. Exactly one of `provider` (a named providers entry
  # carrying the base URL and egress), `endpoint` (the legacy inline
  # form — an implicit direct provider), or `providers` (an ordered
  # candidate chain, see below) is required; any two of the three, or
  # none, is a rejection. The upstream receives the request at
  # `<base>/chat/completions` or `<base>/responses` (the base must not
  # include the /chat/completions or /responses suffix).
  gpt-reviewer:
    provider: opencode
    # Required. The model name actually sent to the upstream provider.
    upstream-model: gpt-5-pro
    # Optional. A system-level instruction injected into EVERY request for
    # this model. Empty (or omitted) disables injection.
    #
    # Chat Completions: prepended as a {"role":"system","content":...}
    # message at index 0 of `messages`. If `messages` is absent or not a
    # JSON array the request passes through untouched — we never corrupt a
    # request to inject.
    #
    # Responses API: merged into `instructions` as a developer message. If
    # `instructions` is a string it is prefixed (prompt + "\n\n" + text); an
    # array gets a developer message item prepended; any other type is left
    # untouched.
    injection-prompt: |
      Review the following code rigorously. Report every bug you can find,
      ordered by severity, and suggest a fix for each.
    # Optional. Simulated thinking-usage synthesis: attribute a share of the
    # upstream-reported output tokens to thinking in the client-facing usage
    # object, for upstream models that reason without ever reporting
    # reasoning tokens. Absent or null (like echo-model below) means the
    # feature is off and responses stay byte-identical.
    thinking-usage:
      # Required when the block is present: auto (only when the request
      # signals thinking), always (every request, overriding the request's
      # signal), or off.
      mode: auto
      # Optional share bounds, each a finite number in [0,1] with
      # min-ratio <= max-ratio. Both omitted -> fixed 0.75; one set -> fixed
      # to it; both set -> the share is drawn per request in this range.
      min-ratio: 0.6
      max-ratio: 0.9
    # Optional. Per-model status retry policy: EVERY candidate of the model
    # (the single provider here, or every chain entry below) walks under it,
    # and the same-candidate budget is enforced per candidate. Absent or
    # null (like echo-model) selects exactly the defaults shown — the
    # status disposition matrix applies by default, this block only SIZES
    # it (which statuses retry, move on, or terminate is not configurable).
    # Disposition summary: 408/425/429 and every 5xx except 501/505 retry
    # this candidate while budget remains, then fall to the next; a
    # 4xx/5xx whose error body stalls or fails its capture, and a 200 that
    # is unparseable or over the buffered cap, are unusable answers and
    # retry the same way; 401/403/404/405/409/422 move to the next
    # candidate immediately (no same-candidate retry); every other status
    # is terminal; caller cancellation is never retried or slept through;
    # transport failures fall to the next candidate as before. The client
    # always sees the LAST answer received.
    #
    # retries:
    #   # Same-candidate retries AFTER the initial attempt, per candidate:
    #   # 0 = one upstream exchange, 1 = two (the default), at most 8.
    #   max-retries: 1
    #   # One candidate's whole retry sequence must fit in this window,
    #   # measured from its first attempt and checked before scheduling a
    #   # wait; at least 1s, at most 2m.
    #   max-elapsed: 10s
    #   backoff:
    #     # Delay before the first retry; doubled per further retry; >= 1ms.
    #     initial: 250ms
    #     # Caps the exponential growth AND any upstream Retry-After (an
    #     # upstream can never make the proxy sleep longer than this);
    #     # must be >= initial — omitted while initial sits above the 2s
    #     # default, the ceiling rises to the initial.
    #     max: 2s
    #     # Uniform ±fraction spread of each delay, 0..1, so concurrent
    #     # retries do not re-hit a recovering provider in step.
    #     jitter: 0.1

  # A second example, without injection — pure model renaming.
  echo-model:
    endpoint: https://api.provider.example/v1
    upstream-model: gpt-4o-mini

  # A chain example: an ordered provider candidate list. The first entry
  # is the primary route; later entries are fallbacks reached when an
  # earlier candidate has no usable answer — a transport failure (dial,
  # TLS, proxy, egress exhaustion), a retryable status (408, 425, 429, any
  # 5xx except 501/505) whose same-candidate retry budget under the model's retries policy
  # is spent, or a "not this provider" status (401, 403, 404, 405, 409,
  # 422), which moves without waiting. Every other status is terminal and
  # relayed exactly as a single-provider deployment would relay it, and the
  # client always sees the LAST answer received (status preserved, body the
  # canonical envelope — never raw provider bytes). Each candidate carries
  # its own upstream-model; the injection prompt, thinking-usage and
  # retries above stay model-level (every candidate receives the same
  # prompt and walks under the same retry policy). Bounded by the
  # provider-fallback block below: worst case is max-attempts candidates ×
  # (max-retries + 1) exchanges each, with any egress pool's own fallback
  # budget nested under a single candidate attempt. Both maxima together
  # (8 candidates × 9 exchanges) is 72 exchanges for one request, and
  # max-elapsed bounds one candidate's sleeps, not the whole request — a
  # client that sets no deadline can hold a connection for a long time.
  # chained-model:
  #   providers:
  #     - provider: opencode # primary: the providers-table entry above
  #       upstream-model: gpt-5-pro
  #     - provider: opencode-backup # a second providers-table entry
  #       upstream-model: gpt-5-pro

# Optional. Bounds the provider candidate walk of chain models. Absent
# selects the defaults below; a present block is validated even when it
# disables the feature. max-attempts is the per-request candidate budget
# (at least 1, at most 8) — the walk stops after this many candidates were
# tried, chain length permitting; each tried candidate performs up to
# (retries.max-retries + 1) upstream exchanges under that model's retries
# policy. Hot-reloads with the rest of the file.
#
# provider-fallback:
#   enabled: true
#   max-attempts: 2

# Optional. SSE keep-alive comments for client-facing Chat Completions and
# Responses API streams. The default is enabled at 15s because a Cloudflare-
# proxied hostname silently cuts a client HTTP/2 stream after about 125s with
# zero bytes from origin. While the upstream is silent, the injector writes
# and flushes the spec-compliant (and client-ignored) SSE comment `: ping\n\n`
# once per interval; every forwarded upstream byte resets that silence clock.
# The ticker starts after upstream response headers reach the client, so it
# does not cover waiting for those headers. `interval` must be a Go duration
# of at least 1s. This block hot-reloads with the model mappings; invalid
# reloads retain the complete last-known-good setting.
#
# sse-keep-alive:
#   enabled: true
#   interval: 15s

# Optional. The log level, hot-reloadable like everything else in this
# file: change it here and the running process picks it up on the next
# poll, no restart and no signal. One of debug | info | warn | error,
# matched exactly (the same spelling the organisation's other Go services
# use); absent selects info. There is no LOG_LEVEL environment variable —
# this key is the single source of truth.
log-level: info
