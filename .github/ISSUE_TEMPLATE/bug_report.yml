name: Bug report
description: The injector behaves differently from its documented contract.
title: "bug: "
labels: ["needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        [`README.md`](../../blob/main/README.md) is the behavior contract —
        please quote the passage the behavior disagrees with. Failure
        classification, reload semantics, injection behavior, streaming, and
        shutdown each have their own section.

        **Do not report a security vulnerability here.** An Authorization
        header, upstream endpoint, or injection prompt reaching a log line or
        an error body goes through a [private security advisory](../../security/advisories/new)
        instead — see [SECURITY.md](../../blob/main/SECURITY.md).

        Never paste credentials or real `Authorization` values into this
        form; use placeholders.
  - type: checkboxes
    id: before-filing
    attributes:
      label: Before filing
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: This report contains no credentials and no real Authorization values.
          required: true
  - type: textarea
    id: what-happens
    attributes:
      label: What happens?
      description: The observed behavior — terminal status codes, log lines (redacted), response bodies.
    validations:
      required: true
  - type: textarea
    id: what-should-happen
    attributes:
      label: What should happen instead?
      description: Quote the documented contract (README/AGENTS passage) the behavior disagrees with.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which area does this belong to?
      options:
        - Config + hot reload (internal/config)
        - Injection transforms (internal/inject)
        - Egress transports (internal/transport)
        - Proxy handlers + streaming (internal/proxy)
        - Server lifecycle + shutdown (internal/server)
        - CLI (cmd)
        - E2E suite (e2e)
        - Documentation
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - `./bin/openai-compatible-injector version` output (or image tag)
        - Deployment: docker compose / bare binary
        - OS and architecture
    validations:
      required: true
  - type: textarea
    id: anything-else
    attributes:
      label: Anything else?
    validations:
      required: false
